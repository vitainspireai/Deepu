services:
  - type: web
    name: deepu-krishna
    env: python
    plan: starter          # free plan has no persistent disk — photos would be wiped on restart
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: photos
      mountPath: /opt/render/project/src/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GALLERY_TOKEN
        generateValue: true     # after deploy, copy this value from the dashboard to build the family links (see DEPLOY.md)
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: BASE_URL
        sync: false         # fill in after deploy: https://<your-service>.onrender.com
